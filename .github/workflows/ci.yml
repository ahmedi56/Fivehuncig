name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Database security tests (community migration in PGlite)
        run: npm run test:db
      - name: Web build smoke test
        run: npx expo export --platform web
      - name: Dependency audit (report only)
        run: npm audit --omit=dev --audit-level=high || true
